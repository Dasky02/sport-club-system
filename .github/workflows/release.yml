name: Release
on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish both images to GHCR after tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sport-club-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version and create release notes
        id: version
        run: |
          python3 scripts/check_public_content.py
          RELEASE_VERSION=$(cat VERSION)
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'This version is already released. Bump VERSION in a reviewed PR.' >&2
            exit 1
          fi
          python3 scripts/release_notes.py > release-body.md
      - name: Tag and release the checked commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" --verify-tag --title "v$RELEASE_VERSION" --notes-file release-body.md
  images:
    needs: release
    if: inputs.publish_images
    uses: ./.github/workflows/ghcr-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.release.outputs.version }}
