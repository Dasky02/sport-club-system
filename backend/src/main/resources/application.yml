spring:
  application:
    name: sport-club-system
  # Kontejnery používají DB_HOST=db; lokální vývoj nastavuje localhost.
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${POSTGRES_DB:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

info:
  cacheTtlMs: ${INFO_CACHE_TTL_MS:600000}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  # HTTPS nasazení vyžaduje důvěryhodnou reverzní proxy (viz docs/deployment.md).
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    session:
      cookie:
        name: JSESSIONID
        path: /api
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:5s}

logging:
  level:
    org.hibernate.SQL: warn
