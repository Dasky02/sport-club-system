services:
  backend:
    environment:
      CORS_ALLOWED_ORIGINS: https://${PUBLIC_HOST:?Set your public DNS hostname}
      SESSION_COOKIE_SECURE: 'true'
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://${PUBLIC_HOST:?Set your public DNS hostname}/api
  proxy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set your public DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set email for certificate management}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
